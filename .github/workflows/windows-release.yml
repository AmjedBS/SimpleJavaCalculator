name: Windows application

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Download JavaFX 21 Windows JMODs
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP "javafx-jmods.zip"
          curl.exe -fL --retry 3 --output $archive "https://download2.gluonhq.com/openjfx/21.0.12/openjfx-21.0.12_windows-x64_bin-jmods.zip"
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to download the JavaFX JMOD archive."
          }
          tar.exe -xf $archive -C lib
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to extract the JavaFX JMOD archive."
          }

      - name: Build standalone application
        shell: cmd
        run: build_final.cmd

      - name: Package downloadable ZIP
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          Compress-Archive -Path "dist\FXCalculator" -DestinationPath "dist\FXCalculator-windows-x64.zip" -CompressionLevel Optimal

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/FXCalculator-windows-x64.zip
